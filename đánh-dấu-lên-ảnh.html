<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vẽ lên ảnh</title>
<style>
  :root {
    --bg: #16171a;
    --panel: #1e2024;
    --line: #2c2e33;
    --text: #e7e6e2;
    --text-dim: #8b8d92;
    --accent: #e8a33d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  header { margin-bottom: 32px; }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  header p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 0;
  }

  .layout {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  .stage {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .stage.drag-over {
    border-color: var(--accent);
    background: #232016;
  }

  .drop-msg {
    text-align: center;
    color: var(--text-dim);
    padding: 40px;
    cursor: pointer;
  }

  .drop-msg .big {
    font-size: 15px;
    color: var(--text);
    margin-bottom: 6px;
  }

  .drop-msg .small { font-size: 13px; }

  .drop-msg svg {
    margin-bottom: 14px;
    opacity: 0.5;
  }

  #canvasWrap {
    width: 100%;
    height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  #canvasWrap.active { display: flex; }

  .canvas-stack {
    position: relative;
    line-height: 0;
  }

  .canvas-stack canvas {
    max-width: 100%;
    max-height: 560px;
    border-radius: 6px;
    display: block;
  }

  #drawCanvas {
    position: absolute;
    top: 0;
    left: 0;
    touch-action: none;
    cursor: none;
  }

  #cursorRing {
    position: absolute;
    top: 0;
    left: 0;
    border-radius: 50%;
    pointer-events: none;
    transform: translate(-50%, -50%);
    display: none;
    box-sizing: border-box;
  }

  #cursorRing.pen {
    border: 1.5px solid var(--accent);
    background: rgba(232, 163, 61, 0.12);
  }

  #cursorRing.eraser {
    border: 1.5px solid var(--text);
    background: rgba(255, 255, 255, 0.15);
  }

  input[type="file"] { display: none; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
  }

  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 0 0 16px;
  }

  .tool-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .tool-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    font-family: inherit;
    font-size: 13px;
    padding: 10px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .tool-btn:hover { border-color: var(--text-dim); }

  .tool-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #201603;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 18px;
    font-size: 13.5px;
  }

  .row:last-of-type { margin-bottom: 0; }

  input[type="color"] {
    width: 42px;
    height: 32px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 2px;
    background: transparent;
    cursor: pointer;
  }

  input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--line);
    outline: none;
    margin-left: 12px;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #16171a;
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: 2px solid #16171a;
  }

  .size-val {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    width: 26px;
    text-align: right;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }

  button.plain {
    flex: 1;
    font-family: inherit;
    font-size: 13px;
    border-radius: 7px;
    padding: 10px 12px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--text);
    transition: border-color 0.15s ease;
  }

  button.plain:hover { border-color: var(--text-dim); }
  button.plain:disabled { opacity: 0.35; cursor: not-allowed; }

  button.primary {
    width: 100%;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    border-radius: 7px;
    padding: 11px 14px;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #201603;
  }

  button.primary:hover { opacity: 0.92; }
  button.primary:disabled { opacity: 0.35; cursor: not-allowed; }

  .hint {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Vẽ lên ảnh</h1>
    <p>Tải ảnh lên, chọn bút hoặc tẩy để vẽ trực tiếp lên ảnh.</p>
  </header>

  <div class="layout">
    <div class="stage" id="stage">
      <div class="drop-msg" id="dropMsg">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M12 16V4M12 4L7 9M12 4l5 5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 16v3a2 2 0 002 2h12a2 2 0 002-2v-3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="big">Kéo thả ảnh vào đây</div>
        <div class="small">hoặc bấm để chọn tệp từ máy</div>
      </div>
      <div id="canvasWrap">
        <div class="canvas-stack" id="canvasStack">
          <canvas id="imageCanvas"></canvas>
          <canvas id="drawCanvas"></canvas>
          <div id="cursorRing" class="pen"></div>
        </div>
      </div>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div class="panel">
      <h2>Công cụ</h2>

      <div class="tool-toggle">
        <button class="tool-btn active" data-tool="pen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
          Bút vẽ
        </button>
        <button class="tool-btn" data-tool="eraser">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 20H8l-6-6 10-10 8 8z"/><path d="M6 14l6 6"/></svg>
          Tẩy
        </button>
      </div>

      <div class="row" id="colorRow">
        <span>Màu bút</span>
        <input type="color" id="colorInput" value="#e8a33d">
      </div>

      <div class="row">
        <span>Kích thước</span>
        <input type="range" id="sizeInput" min="1" max="60" value="8">
        <span class="size-val" id="sizeVal">8</span>
      </div>

      <div class="btn-row">
        <button class="plain" id="undoBtn" disabled>Hoàn tác</button>
        <button class="plain" id="redoBtn" disabled>Làm lại</button>
      </div>

      <div class="btn-row">
        <button class="plain" id="clearDrawBtn" disabled>Xóa nét vẽ</button>
        <button class="plain" id="changeBtn" disabled>Chọn ảnh khác</button>
      </div>

      <div class="btn-row">
        <button class="primary" id="downloadBtn" disabled>Tải ảnh xuống</button>
      </div>

      <div class="hint">Tẩy chỉ xóa nét bút đã vẽ, không làm hỏng ảnh gốc bên dưới. Xử lý hoàn toàn trong trình duyệt.</div>
    </div>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const dropMsg = document.getElementById('dropMsg');
  const canvasWrap = document.getElementById('canvasWrap');
  const imageCanvas = document.getElementById('imageCanvas');
  const drawCanvas = document.getElementById('drawCanvas');
  const ictx = imageCanvas.getContext('2d');
  const dctx = drawCanvas.getContext('2d');
  const fileInput = document.getElementById('fileInput');

  const toolButtons = document.querySelectorAll('.tool-btn');
  const colorInput = document.getElementById('colorInput');
  const sizeInput = document.getElementById('sizeInput');
  const sizeVal = document.getElementById('sizeVal');

  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  const clearDrawBtn = document.getElementById('clearDrawBtn');
  const changeBtn = document.getElementById('changeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const cursorRing = document.getElementById('cursorRing');

  let hasImage = false;
  let currentTool = 'pen';
  let isDrawing = false;
  let lastPos = null;

  let undoStack = [];
  let redoStack = [];
  const MAX_HISTORY = 25;

  function loadFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      const image = new Image();
      image.onload = () => {
        const maxW = 1400;
        const scale = image.width > maxW ? maxW / image.width : 1;
        const w = Math.round(image.width * scale);
        const h = Math.round(image.height * scale);

        imageCanvas.width = w;
        imageCanvas.height = h;
        drawCanvas.width = w;
        drawCanvas.height = h;

        ictx.clearRect(0, 0, w, h);
        ictx.drawImage(image, 0, 0, w, h);
        dctx.clearRect(0, 0, w, h);

        hasImage = true;
        undoStack = [];
        redoStack = [];
        updateHistoryButtons();

        dropMsg.style.display = 'none';
        canvasWrap.classList.add('active');
        changeBtn.disabled = false;
        downloadBtn.disabled = false;
        clearDrawBtn.disabled = false;
      };
      image.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function getPos(e) {
    const rect = drawCanvas.getBoundingClientRect();
    const scaleX = drawCanvas.width / rect.width;
    const scaleY = drawCanvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function pushHistory() {
    const snap = dctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
    undoStack.push(snap);
    if (undoStack.length > MAX_HISTORY) undoStack.shift();
    redoStack = [];
    updateHistoryButtons();
  }

  function updateHistoryButtons() {
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }

  function undo() {
    if (!undoStack.length) return;
    const current = dctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
    redoStack.push(current);
    const prev = undoStack.pop();
    dctx.putImageData(prev, 0, 0);
    updateHistoryButtons();
  }

  function redo() {
    if (!redoStack.length) return;
    const current = dctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
    undoStack.push(current);
    const next = redoStack.pop();
    dctx.putImageData(next, 0, 0);
    updateHistoryButtons();
  }

  function drawDot(x, y, size) {
    dctx.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : 'source-over';
    dctx.fillStyle = colorInput.value;
    dctx.beginPath();
    dctx.arc(x, y, size / 2, 0, Math.PI * 2);
    dctx.fill();
  }

  function drawSeg(x1, y1, x2, y2, size) {
    dctx.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : 'source-over';
    dctx.strokeStyle = colorInput.value;
    dctx.lineWidth = size;
    dctx.lineCap = 'round';
    dctx.lineJoin = 'round';
    dctx.beginPath();
    dctx.moveTo(x1, y1);
    dctx.lineTo(x2, y2);
    dctx.stroke();
  }

  toolButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      toolButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentTool = btn.dataset.tool;
      cursorRing.className = currentTool;
    });
  });

  function updateCursorRing(clientX, clientY) {
    const rect = drawCanvas.getBoundingClientRect();
    const displayScale = rect.width / drawCanvas.width;
    const size = parseInt(sizeInput.value, 10) * displayScale;
    cursorRing.style.width = size + 'px';
    cursorRing.style.height = size + 'px';
    cursorRing.style.left = (clientX - rect.left) + 'px';
    cursorRing.style.top = (clientY - rect.top) + 'px';
  }

  sizeInput.addEventListener('input', () => {
    sizeVal.textContent = sizeInput.value;
    if (lastClientPos) updateCursorRing(lastClientPos.x, lastClientPos.y);
  });

  let lastClientPos = null;

  drawCanvas.addEventListener('pointerenter', (e) => {
    if (!hasImage) return;
    lastClientPos = { x: e.clientX, y: e.clientY };
    updateCursorRing(e.clientX, e.clientY);
    cursorRing.style.display = 'block';
  });

  drawCanvas.addEventListener('pointerleave', () => {
    cursorRing.style.display = 'none';
    lastClientPos = null;
  });

  drawCanvas.addEventListener('pointerdown', (e) => {
    if (!hasImage) return;
    drawCanvas.setPointerCapture(e.pointerId);
    pushHistory();
    isDrawing = true;
    const pos = getPos(e);
    lastPos = pos;
    drawDot(pos.x, pos.y, parseInt(sizeInput.value, 10));
  });

  drawCanvas.addEventListener('pointermove', (e) => {
    lastClientPos = { x: e.clientX, y: e.clientY };
    updateCursorRing(e.clientX, e.clientY);
    if (!isDrawing) return;
    const pos = getPos(e);
    drawSeg(lastPos.x, lastPos.y, pos.x, pos.y, parseInt(sizeInput.value, 10));
    lastPos = pos;
  });

  function endStroke() { isDrawing = false; }
  drawCanvas.addEventListener('pointerup', endStroke);
  drawCanvas.addEventListener('pointercancel', endStroke);

  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);

  clearDrawBtn.addEventListener('click', () => {
    if (!hasImage) return;
    pushHistory();
    dctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  });

  downloadBtn.addEventListener('click', () => {
    const out = document.createElement('canvas');
    out.width = imageCanvas.width;
    out.height = imageCanvas.height;
    const octx = out.getContext('2d');
    octx.drawImage(imageCanvas, 0, 0);
    octx.drawImage(drawCanvas, 0, 0);
    const link = document.createElement('a');
    link.download = 've-len-anh.png';
    link.href = out.toDataURL('image/png');
    link.click();
  });

  dropMsg.addEventListener('click', () => fileInput.click());
  changeBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => loadFile(e.target.files[0]));

  ['dragenter', 'dragover'].forEach((evt) => {
    stage.addEventListener(evt, (e) => { e.preventDefault(); stage.classList.add('drag-over'); });
  });
  ['dragleave', 'drop'].forEach((evt) => {
    stage.addEventListener(evt, (e) => { e.preventDefault(); stage.classList.remove('drag-over'); });
  });
  stage.addEventListener('drop', (e) => loadFile(e.dataTransfer.files[0]));
</script>
</body>
</html>
